.rads-smart-find{display:grid;gap:8px}
.rads-smart-find h3{font-weight:800}

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSoundEffect(type) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const playTone = (freq, start, dur, wave = 'sine', gainVal = 0.25) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, now + start);
        gain.gain.setValueAtTime(gainVal, now + start);
        gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + start);
        osc.stop(now + start + dur);
      };

      if (type === 'cashIn') {
        playTone(987.77, 0, 0.14, 'triangle', 0.3);
        playTone(1318.51, 0.12, 0.35, 'triangle', 0.35);
      } else if (type === 'cashOut') {
        playTone(523.25, 0, 0.15, 'sine', 0.25);
        playTone(392.00, 0.14, 0.28, 'sine', 0.25);
      } else if (type === 'printOrder') {
        playTone(880, 0, 0.12, 'square', 0.2);
        playTone(880, 0.16, 0.12, 'square', 0.2);
        playTone(1174.66, 0.32, 0.28, 'square', 0.25);
      } else if (type === 'specialAlert') {
        playTone(659.25, 0, 0.15, 'sine', 0.28);
        playTone(880.00, 0.14, 0.15, 'sine', 0.28);
        playTone(1318.51, 0.28, 0.35, 'sine', 0.3);
      }
    } catch (e) {}
  }

  function triggerDesktopNotification(title, body, soundType = 'specialAlert') {
    playSoundEffect(soundType);
    let blinks = 0;
    const origTitle = "ROSHAN ADVERTISING SERVICES (PVT) LTD.";
    const blinkTimer = setInterval(() => {
      document.title = blinks % 2 === 0 ? `🔴 ALERT: ${title}` : origTitle;
      blinks++;
      if (blinks > 12) { clearInterval(blinkTimer); document.title = origTitle; }
    }, 700);

    if ("Notification" in window) {
      if (Notification.permission === "granted") {
        new Notification(title, { body });
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(p => { if (p === "granted") new Notification(title, { body }); });
      }
    }
  }

      ui.cloudSynced = true;
      cloudStartError='';
      render();
    } else {

      if(snap.metadata.fromCache||initializingState)return;
      initializingState=true;
      try{
        await runTransaction(db,async transaction=>{
          const current=await transaction.get(stateDocRef);
          if(current.exists())return;
          const previous=await transaction.get(previousStateRef);
          if(!previous.exists())throw Error('පරණ සේවක ගිණුම් හමු වුණේ නැහැ.');
          transaction.set(stateDocRef,freshRadsState(previous.data()));
        });
      }catch(err){cloudStartError=err.message;render();}
      finally{initializingState=false;}
    }
  },err=>{cloudStartError=err.message;render();});

  function calcCashierBalances() {
    const today = getColomboDate();
    const res = { Ground: 0, Upper: 0, Counter3: 0, Total: 0, todayCashIncome: 0, todayBankIncome: 0, todayExpenses: 0, todayTeaDeducted: 0 };

    cloudData.bills.filter(b => b.date === today && b.status !== 'Pending').forEach(b => {
      const cashAmt = Number(b.advance || 0);
      const bankAmt = Number(b.bankPaid || 0);
      if (b.payMethod === 'Bank Transfer' && bankAmt === 0) {
        res.todayBankIncome += cashAmt;
      } else {
        res.todayCashIncome += cashAmt;
        res.todayBankIncome += bankAmt;
        if (res[b.floor] !== undefined) res[b.floor] += cashAmt;
        else res.Ground += cashAmt;
      }
    });

    (cloudData.bankTransfers || []).filter(bt => bt.date === today).forEach(bt => {
      res.todayBankIncome += Number(bt.amount || 0);
    });

    cloudData.extraWorks.filter(e => e.date === today).forEach(e => {
      const amt = Number(e.amount || 0);
      res.todayExpenses += amt;
      if (res[e.floor] !== undefined) res[e.floor] -= amt;
      else res.Ground -= amt;
    });

    (cloudData.teaTransfers || []).filter(t => t.date === today).forEach(t => {
      const amt = Number(t.amount || 0);
      res.todayTeaDeducted += amt;
      if (res[t.floor] !== undefined) res[t.floor] -= amt;
      else res.Ground -= amt;
    });

    res.Total = res.Ground + res.Upper + res.Counter3;
    return res;
  }

  function calcMonthlyStats() {
    const monthPrefix = getCurrentMonthPrefix();
    let mIncome = 0, mExpenses = 0, mTea = 0, totalCustomerDues = 0;

    cloudData.bills.forEach(b => {
      if (b.date.startsWith(monthPrefix) && b.status !== 'Pending') {
        mIncome += Number(b.advance || 0) + Number(b.bankPaid || 0);
      }
      if (b.balance > 0) totalCustomerDues += Number(b.balance || 0);
    });
    (cloudData.bankTransfers || []).filter(bt => bt.date.startsWith(monthPrefix)).forEach(bt => mIncome += Number(bt.amount || 0));
    cloudData.extraWorks.filter(e => e.date.startsWith(monthPrefix)).forEach(e => mExpenses += Number(e.amount || 0));
    (cloudData.teaTransfers || []).filter(t => t.date.startsWith(monthPrefix)).forEach(t => mTea += Number(t.amount || 0));

    return {
      mIncome,
      mExpenses: mExpenses + mTea,
      mNet: mIncome - (mExpenses + mTea),
      totalCustomerDues
    };
  }

  window.handlePhotoUpload = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const maxDim = 150;
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
        else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

        const me = cloudData.staff.find(x => x.id === ui.user.id);
        if (me) {
          me.photo = compressedDataUrl;
          ui.user.photo = compressedDataUrl;
          await saveCloud(`${me.name} updated profile photo`);

      img.src = e.target.result;
    };

  function billDraftTotal(draft) {
    return fixed(draft.items.reduce((sum,item)=>sum+Number(item.qty||0)*fixed(item.price||0),0)+Number(draft.serviceCharge||0));

  function billCashPayment(draft,total) {
    const tendered=Number(draft.cashTendered);
    if(draft.pending||draft.payMethod!=='Cash'||!draft.cashTendered||!Number.isFinite(tendered)||tendered<0||!Number.isFinite(total)||total<0)return null;
    return {paid:fixed(Math.min(total,tendered)),change:fixed(Math.max(0,tendered-total))};
  }

    const adv = d.pending ? 0 : Number(d.advance || 0);
    const bal = Math.max(0, total - adv);
    const status = d.pending ? 'Pending' : (bal <= 0 ? 'FULL PAID' : 'Balance Due');
    const nextNum = String(cloudData.bills.length + 1).padStart(3, '0');
    const billId = 'RADS-' + nextNum;

    const isBankDirect = d.payMethod === 'Bank Transfer';

      items: JSON.parse(JSON.stringify(d.items)),
      serviceCharge: Number(d.serviceCharge || 0),
      serviceNote: d.serviceNote,

      advance: isBankDirect ? 0 : adv,
      bankPaid: isBankDirect ? adv : 0,

    if (d.customer && d.customer !== '-' && d.customer.length > 2) {

    const amtStr = prompt(`${bill.id} (Balance: Rs. ${bill.balance}) සඳහා ගෙවූ මුදල ඇතුළත් කරන්න:`, bill.balance);
    if (!amtStr) return;
    const paid = Number(amtStr);
    if (isNaN(paid) || paid <= 0) return;

    const isBank = confirm(`මෙම Rs. ${paid} ලැබුණේ BANK TRANSFER එකක් විදියටද?\n\n[OK] = Bank Transfer (Cashier එකට එකතු නොවේ)\n[Cancel] = Cash (Cashier Register එකට එකතු වේ)`);

    if (isBank) {
      bill.bankPaid = (bill.bankPaid || 0) + paid;
      bill.payMethod = 'Bank Transfer';
    } else {
      bill.advance = (bill.advance || 0) + paid;
      playSoundEffect('cashIn');
    }

    const totalPaid = (bill.advance || 0) + (bill.bankPaid || 0);
    bill.balance = Math.max(0, bill.total - totalPaid);
    bill.status = bill.balance === 0 ? 'FULL PAID' : 'Balance Due';

    cloudData.jobs.forEach(j => {
      if (j.billNo && j.billNo.toUpperCase() === bill.id.toUpperCase() && bill.balance === 0) {
        j.steps.Payment = true;
      }
    });

    await saveCloud(`Collected Rs. ${paid} (${isBank ? 'Bank Transfer' : 'Cash'}) for ${bill.id}`);

  window.markAttendanceAndTea = async (staffId, isPresent) => {
    if (!isBillingRole()) return;
    const date = ui.teaAttendanceDate || todayISO();
    const parsed = new Date(date + 'T00:00:00Z');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(parsed.getTime()) ||
        parsed.toISOString().slice(0,10)!==date || date>todayISO()) {
      return alert('අද හෝ කලින් දිනයක් තෝරන්න.');
    }
    try {
      await commitUpdate(`Tea attendance: ${staffId} ${date} ${isPresent?'Present':'Leave'}`,(state,actor)=>{
        if (!isManagerOrCashier(actor)) throw Error('Cashier access අවශ්‍යයි.');
        const person=state.staff.find(member=>member.id===staffId&&!member.isFamily);
        if (!person) throw Error('සේවකයා හමු වුණේ නැහැ.');
        if (teaAttendanceFor(person,date)!==undefined) throw Error('මේ දිනය දැනටමත් සටහන් කර ඇත.');
        const history=person.teaAttendance ||= {};
        if (person.lastMarkedDate && !Object.hasOwn(history,person.lastMarkedDate)) {
          history[person.lastMarkedDate]=Boolean(person.presentToday);
        }
        history[date]=Boolean(isPresent);
        if (!person.lastMarkedDate || date>person.lastMarkedDate) {
          person.lastMarkedDate=date;
          person.presentToday=Boolean(isPresent);
        }
        if (isPresent) {
          person.teaEarned=Number(person.teaEarned||0)+100;
          state.pendingTeaDeduction=Number(state.pendingTeaDeduction||0)+100;
        } else {
          person.leaves=Number(person.leaves||0)+1;
        }
      });
    } catch (error) {
      alert(error.message);
    }
  };

  window.parseFingerprintFile = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const lines = e.target.result.split(/\r?\n/).filter(Boolean);
      const parsed = [];
      lines.slice(1).forEach(line => {
        const cols = line.split(',');
        if (cols.length >= 4) {
          const name = cols[0].trim();
          const date = cols[1].trim();
          const inTime = cols[2].trim();
          const outTime = cols[3].trim();
          let otHours = 0;
          if (outTime && outTime.includes(':')) {
            const [oh, om] = outTime.split(':').map(Number);
            if (oh >= 18) otHours = Number(((oh - 18) + (om / 60)).toFixed(2));
          }
          parsed.push({ name, date, inTime, outTime, otHours });
        }
      });
      ui.fpRecords = parsed;
      alert(`✅ Fingerprint File කියවා අවසන්! (Zero Cloud Storage Used)\nවාර්තා ${parsed.length}ක් හමුවිය.`);
      render();
    };
    reader.readAsText(file);
  };

  window.addQuotationPhoto = async input => {
    const file=input.files?.[0];
    if (!file) return;
    const draft=ui.draftQuote;
    const request={};
    draft.photoRequest=request;
    const url=URL.createObjectURL(file);
    try {
      const image=new Image();
      image.src=url;
      await image.decode();
      const scale=Math.min(1,1400/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      if (draft.photoRequest!==request) return;
      draft.photo=canvas.toDataURL('image/jpeg',0.88);
      if (ui.page==='quotation') render();
    } catch (error) {
      if (draft.photoRequest===request) alert('Photo එක විවෘත කළ නොහැක. JPG හෝ PNG එකක් තෝරන්න.');
    } finally {
      URL.revokeObjectURL(url);
      input.value='';
    }
  };

const isBillingRole = () => isManagerOrCashier(ui.user) && !ui.user.disabled;

async function commitUpdate(action, apply) {
  if (!ui.user) throw Error('නැවත login වෙලා උත්සාහ කරන්න.');
  if (busyCounter) throw Error('දැනට save වෙමින් පවතී.');
  busyCounter = true;
  const actor = ui.user.id;
  try {
    return await runTransaction(db, async transaction => {
      const snapshot = await transaction.get(stateDocRef);
      if (!snapshot.exists()) throw Error('පැරණි Firestore දත්ත හමු වුණේ නැහැ.');
      const state = snapshot.data();
      ensureFlexStock(state);
      const person = state.staff?.find(s => s.id === actor && !s.disabled);
      if (!person) throw Error('මෙම සේවකයා සක්‍රීය නැහැ.');
      const result = apply(state, person);
      state.auditLogs = [{time:new Date().toISOString(),user:person.name,action},...(state.auditLogs||[])].slice(0,50);
      transaction.set(stateDocRef,state);
      return result;
    });
  } catch(err) {
    const code=String(err.code||'').replace(/^firestore\//,'');
    if(code==='permission-denied')throw Error('Firestore Rules වලින් දත්ත save කිරීමට අවසර දී නැහැ. Admin වෙත දැනුම් දෙන්න.');
    if(code==='unauthenticated')throw Error('Firebase login එක නැවත පරීක්ෂා කරන්න.');
    if(['unavailable','deadline-exceeded','cancelled'].includes(code)||/offline/i.test(err.message||''))throw Error('Firestore සම්බන්ධ වුණේ නැහැ. Internet සම්බන්ධ වූ පසු මේ තහවුරු කිරීමෙන්ම නැවත Save කරන්න.');
    if(code==='aborted')throw Error('එකවර වෙනත් වෙනසක් save වුණා. මේ තහවුරු කිරීමෙන්ම නැවත Save කරන්න.');
    throw err;
  } finally {busyCounter = false;}
}
function takeBillSnapshot() {
  const d = cloneState(ui.draftBill);
  d.customer = d.customer.trim()||'-';
  const inputPhone = String(d.custPhone||'').trim();
  d.custPhone = clientPhone(inputPhone);
  if (inputPhone && !d.custPhone) throw Error('WhatsApp අංකය පරීක්ෂා කරන්න.');
  const items = d.items.filter(i => String(i.name||i.baseName||'').trim());
  if (!items.length || items.length !== d.items.length) throw Error('සෑම item එකකටම නමක් ඇතුළත් කරන්න.');
  d.items = items.map(i => {
    const w = Number(i.w||0), h = Number(i.h||0);
    const qty = Number(i.qty), price = fixed(i.price);
    if (!Number.isSafeInteger(qty)||qty<1||!Number.isFinite(price)||price<=0||w<0||h<0||!!w!==!!h) throw Error('Item size, quantity සහ unit price පරීක්ෂා කරන්න.');
    return {...i,qty,price,section:workSection(i)};
  });
  if (d.items.some(isPlate) && (d.customer==='-' || !d.custPhone || !d.vehicle?.trim())) throw Error('Number Plate සඳහා නම, WhatsApp අංකය සහ vehicle number එක දාන්න.');
  if (items.some(isPlate)) {
    if(!/^(?:[A-Z]{2}-[A-Z]{2,3}|[A-Z]{2,3}) [0-9]{4}$/.test(d.vehicle))throw Error('වාහන අංකය NC-AWB 2020 හෝ AB 1234 ආකෘතියට ඇතුළත් කරන්න.');
    d.floor='Ground';
    if(String(d.plateHours??'').trim())plateDue(d.plateHours);
  }
  if (!Object.hasOwn(cashierFloors(),d.floor)) throw Error('Cashier එක තෝරන්න.');
  d.serviceCharge = fixed(d.serviceCharge||0);
  d.total = fixed(d.items.reduce((sum,i)=>sum+i.price*i.qty,0)+d.serviceCharge);
  d.paid = d.pending?0:billCashPayment(d,d.total)?.paid ?? fixed(d.advance||0);
  delete d.cashTendered;
  if(!d.pending&&d.paid===0)throw Error('මුදල් ලැබුණා නම් Paid / Advance එකට දාන්න. මුදල් ලැබුණේ නැත්නම් “ගෙවීමක් නැහැ” තෝරන්න.');
  if (![d.serviceCharge,d.total,d.paid].every(Number.isFinite)||d.total<=0||d.serviceCharge<0||d.paid<0||d.paid>d.total) throw Error('Total, service charge සහ ගෙවූ මුදල පරීක්ෂා කරන්න.');
  d.balance = fixed(d.total-d.paid);

const nextId = (items,prefix,width) => {
  const n=items.reduce((max,item)=>Math.max(max,Number(String(item.id).replace(prefix,''))||0),0)+1;
  return prefix+String(n).padStart(width,'0');

function receiveMoney(b,amount,method,floor,date,cashier,request) {
  const wasLegacy=!Array.isArray(b.payments);
  if(wasLegacy){
    b.payments=[];
    const cash=Number(b.advance||0), bank=Number(b.bankPaid||0);
    if(cash||bank){
      const legacyBank=b.payMethod==='Bank Transfer'&&!bank;
      if(cash&&!legacyBank)b.payments.push({amount:cash,method:'Cash',floor:b.floor,date:b.date,legacy:true});
      if(bank||legacyBank)b.payments.push({amount:bank||cash,method:'Bank Transfer',floor:b.floor,date:b.date,legacy:true});
      if(legacyBank){b.bankPaid=cash;b.advance=0;}
    }
  }
  if (b.payments.some(p=>p.request===request)) return;
  if (!Number.isFinite(amount)||amount<=0||amount>Number(b.balance)) throw Error('ගෙවීම ඉතිරි මුදලට වඩා වැඩියි හෝ වලංගු නැහැ.');
  b.payments.push({amount,method,floor,date,cashier,request});
  const field=method==='Cash'?'advance':'bankPaid';
  b[field]=fixed(Number(b[field]||0)+amount);
  b.balance=fixed(b.balance-amount);
  b.status=b.balance?'Balance Due':'FULL PAID';
}

function paymentRows(state) {
  return (state.bills||[]).filter(b=>b.status!=='Void').flatMap(b=>{
    if(Array.isArray(b.payments))return b.payments.map(p=>({...p,bill:b.id}));
    if(b.status==='Pending')return [];
    const cash=Number(b.advance||0),bank=Number(b.bankPaid||0),legacyBank=b.payMethod==='Bank Transfer'&&!bank;
    return [
      {amount:legacyBank?0:cash,method:'Cash',floor:b.floor,date:b.date,bill:b.id},
      {amount:legacyBank?cash:bank,method:'Bank Transfer',date:b.date,bill:b.id}
    ].filter(p=>p.amount>0);
  });
}
calcCashierBalances = function(state=cloudData) {
  const day=todayISO();
  const floors=cashierFloors(state);
  const result={...Object.fromEntries(Object.keys(floors).map(id=>[id,0])),Total:0,todayCashIncome:0,todayBankIncome:0,todayExpenses:0,todayTeaDeducted:0,todayWithdrawals:0};
  for(const p of paymentRows(state).filter(p=>p.date===day)){
    if(p.method==='Cash'){result.todayCashIncome+=p.amount;result[Object.hasOwn(floors,p.floor)?p.floor:'Ground']+=p.amount;}
    else result.todayBankIncome+=p.amount;
  }
  for(const p of (state.bankTransfers||[]).filter(p=>p.date===day))result.todayBankIncome+=Number(p.amount||0);
  for(const [entries,label] of [[state.extraWorks,'todayExpenses'],[state.teaTransfers,'todayTeaDeducted']]){
    for(const p of (entries||[]).filter(p=>p.date===day&&!p.voidDetails)){
      result[p.kind==='withdrawal'?'todayWithdrawals':label]+=Number(p.amount);
      if(p.kind!=='petty-settled')result[Object.hasOwn(floors,p.floor)?p.floor:'Ground']-=Number(p.amount);
    }
  }
  for(const advance of state.pettyAdvances||[]){
    if(advance.voidDetails||!Object.hasOwn(floors,advance.floor))continue;
    if(advance.issuedDate===day)result[advance.floor]-=Number(advance.amount);
    if(advance.settledDate===day)result[advance.floor]+=Number(advance.returned);
  }
  for(const a of (state.bbdAllocations||[]).filter(a=>a.date===day&&!a.voidDetails)){
    if(Object.hasOwn(floors,a.floor))result[a.floor]-=Number(a.amount||0);
  }
  result.Total=fixed(Object.keys(floors).reduce((sum,id)=>sum+result[id],0));
  return result;
};
calcMonthlyStats = function(){

  const mIncome=sum(paymentRows(cloudData))+sum(cloudData.bankTransfers);

};

function bindBulkSelection(root) {

    const all=history.querySelector('[data-select-all]');

    const sync=()=>{

      all.disabled=!boxes.length;
      remove.disabled=!count;
      remove.textContent=count?`Delete Selected (${count})`:'Delete Selected';
    };
    all.onchange=()=>{boxes.forEach(box=>{box.checked=all.checked;});sync();};
    boxes.forEach(box=>{box.onchange=sync;});
    remove.onclick=()=>voidHistory(history.dataset.history,selected().map(box=>box.dataset.voidId));

async function voidHistory(type,ids) {
  if (!isBossOrFamily(ui.user)||busyCounter||!ids.length) return;
  const kind=type==='bills'?'Bill':'Petty Cash';
  const reason=prompt(`${kind} සටහන් ${ids.length}ක් ඉවත් කරන හේතුව`)?.trim();
  if (!reason) return;
  if (!confirm(`${kind} සටහන් ${ids.length}ක් Void කරන්නද? අදාළ ශේෂ සහ වාර්තා යාවත්කාලීන වේ.`)) return;
  const selected=new Set(ids);
  try {
    await commitUpdate(`Void ${kind} (${ids.length})`,(state,person)=>{
      if (!isBossOrFamily(person)) throw Error('Boss access අවශ්‍යයි.');
      const records=type==='bills'?state.bills:state.pettyAdvances;
      const matches=(records||[]).filter(row=>selected.has(String(row.id))&&row.status!=='Void'&&!row.voidDetails);
      if (matches.length!==ids.length) throw Error('තෝරාගත් සටහන් වෙනස් වී තිබෙනවා. නැවත තෝරන්න.');
      const details={date:todayISO(),time:new Date().toISOString(),by:person.id,byName:person.name,reason};
      for (const row of matches) {
        if (type==='bills') {
          row.voidDetails={...details,previousStatus:row.status,previousBalance:row.balance};
          row.status='Void';
          row.balance=0;
          for (const job of state.jobs||[]) {
            if (job.steps&&String(job.billNo||'').toUpperCase()===String(row.id).toUpperCase()) {
              job.steps.Invoice=false;
              job.steps.Payment=false;
            }
          }
        } else {
          row.voidDetails=details;
          const expense=(state.extraWorks||[]).find(e=>e.id==='petty-'+row.id&&e.kind==='petty-settled');
          if (expense) expense.voidDetails=details;
        }
      }
    });
  } catch (error) {
    alert(error.message);
  }

window.radsStockChange = async (index,mode) => {
  if(!canUpdateStock(ui.user)||(mode==='archive'&&!isBossOrFamily(ui.user)))return;
  const cached=cloudData.stock[index],itemId=cached?.id;
  if(mode!=='new'&&!cached)return;
  const name=mode==='new'?prompt('අලුත් stock item නම')?.trim():cached.name;
  if(!name)return;
  const raw=mode==='archive'?'0':prompt('Quantity',mode==='adjust'?String(cached.bought-cached.used):'1');
  if(raw===null||raw.trim()==='')return;
  const qty=Number(raw);
  if(!Number.isSafeInteger(qty)||qty<0||(mode==='use'||mode==='add')&&qty===0)return alert('Quantity එක පරීක්ෂා කරන්න.');
  const reason=prompt('හේතුව')?.trim()||'—';
  try{
    await commitUpdate('Stock '+mode,(s,p)=>{
      if(!canUpdateStock(p)||(mode==='archive'&&!isBossOrFamily(p)))throw Error('Stock access අවශ්‍යයි.');
      if(mode==='new'){s.stock.push({id:uuid(),cat:'General',name,unit:'Each',bought:qty,used:0});return;}
      const st=s.stock.find(x=>x.id===itemId&&!x.archived);
      if(!st)throw Error('Item එක හමු වුණේ නැහැ.');
      const before=Number(st.bought)-Number(st.used);
      if(mode==='archive')st.archived=true;
      if(mode==='adjust')st.bought=Number(st.used)+qty;
      if(mode==='add')st.bought=Number(st.bought)+qty;
      if(mode==='use'){
        if(qty>before)throw Error('Stock එක ප්‍රමාණවත් නැහැ.');
        st.used=Number(st.used)+qty;
      }
      (st.history||=[]).unshift({date:todayISO(),before,after:st.bought-st.used,reason,by:p.name,mode});
    });
  }catch(err){alert(err.message);}
};

function pettyAmount(value) {
  const raw=String(value??'').trim();
  if(!/^\d+(?:\.\d{1,2})?$/.test(raw)||!Number.isSafeInteger(Math.round(Number(raw)*100)))return NaN;
  return fixed(raw);
}
function pettyExpense(issued,returned) {
  if(!Number.isFinite(returned)||returned<0||returned>issued)throw Error('ඉතුරු මුදල අත්තිකාරමට වඩා වැඩි විය නොහැක.');
  return fixed(issued-returned);
}

let salesFilter={query:'',from:'',to:'',plate:false};
function vehicleParts(value) {
  const match=String(value||'').toUpperCase().match(/^(?:([A-Z]{1,2})-)?([A-Z]{0,3})\s*([0-9]{0,4})$/);
  return match ? {province:match[1]||'',prefix:match[2],number:match[3]} : {province:'',prefix:'',number:''};
}
function salesSummary(state,{query,from,to,plate}) {
  const needle=query.trim().toLowerCase();
  const payments=new Map();
  const inRange=date=>Boolean(date)&&(!from||date>=from)&&(!to||date<=to);
  for(const p of paymentRows(state)){
    if(!inRange(p.date))continue;
    if(!payments.has(p.bill))payments.set(p.bill,[]);
    payments.get(p.bill).push(p);
  }
  const rows=[];
  let cash=0,bank=0,billed=0;
  for(const b of state.bills||[]){
    if(b.status==='Void')continue;
    const items=b.items||[];
    const chosen=items.filter(i=>plate?(isPlate(i)&&(!needle||String(b.vehicle||'').toLowerCase().replace(/[^a-z0-9]/g,'').includes(needle.replace(/[^a-z0-9]/g,'')))):(!needle||[i.baseName,i.name,i.category,i.cat].some(v=>String(v||'').toLowerCase().includes(needle))));
    if(!chosen.length)continue;
    const lineCents=i=>Math.round((Number(i.qty)||0)*(Number(i.price)||0)*100);
    const subtotal=items.reduce((n,i)=>n+lineCents(i),0);
    const ratio=chosen.length===items.length?1:subtotal>0?chosen.reduce((n,i)=>n+lineCents(i),0)/subtotal:0;
    const records=payments.get(b.id)||[];
    if(!inRange(b.date)&&!records.length)continue;
    let rowCash=0,rowBank=0;
    for(const p of records){
      const value=Math.round(Number(p.amount)*100*ratio);
      if(p.method==='Cash')rowCash+=value;else rowBank+=value;
    }
    const rowBilled=inRange(b.date)?Math.round(Number(b.total||0)*100*ratio):0;
    cash+=rowCash;bank+=rowBank;billed+=rowBilled;
    rows.push({bill:b,chosen,received:(rowCash+rowBank)/100,billed:rowBilled/100,records});
  }
  return {rows,cash:cash/100,bank:bank/100,billed:billed/100};
}

    ${rows.map(({bill:b,chosen,received,billed,records})=>`<tr class="border-t"><td class="p-2"><button type="button" class="underline" data-sales-id="${txt(b.id)}">${txt(b.id)}</button><br>${txt(b.date)}</td><td>${txt(b.customer)}<br>${txt(b.vehicle)}</td><td>${chosen.map(i=>txt(i.name||i.baseName)).join(', ')}</td><td>Rs. ${currency(billed)}</td><td>Rs. ${currency(received)}</td><td>${[...new Set(records.map(p=>p.date))].map(txt).join(', ')||'—'}</td></tr>`).join('')}</tbody></table>

    target.querySelectorAll('[data-sales-id]').forEach(button=>{button.onclick=()=>radsShowBill(button.dataset.salesId);});
  }
  form.elements.mode.onchange=()=>{form.elements.query.value='';setLabel();form.requestSubmit();};

    e.preventDefault();

}

function jobBelongsTo(job,user) {
  const same=(a,b)=>Boolean(a&&b)&&String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
  return (job.designerId ? job.designerId===user.id : same(job.designer,user.name)) ||
    (job.creatorId ? job.creatorId===user.id : same(job.giver,user.name));
}
window.radsSetJobStep=async (id,key,done)=>{
  try{
    await commitUpdate('Job step updated',(state,person)=>{
      const job=state.jobs.find(j=>j.id===id);
      if(!job||job.deletedAt||!Object.hasOwn(job.steps,key))throw Error('Job එක හමු වුණේ නැහැ.');
      if(!isManagerOrCashier(person)&&!jobBelongsTo(job,person))throw Error('මෙම Job එක වෙනස් කිරීමට අවසර නැහැ.');
      job.steps[key]=done;
    });
  }catch(error){alert(error.message);}
};

function monitorBars(title,entries,minimum,format,note='') {
  const maximum=Math.max(minimum,...entries.map(([,n])=>Math.abs(n)));
  return `<section class="bg-white text-gray-900 border rounded-xl p-4"><h2 class="font-black mb-3">${title}</h2>
    ${note?`<p class="text-xs text-gray-600 mb-3">${note}</p>`:''}
    ${entries.map(([label,value])=>`<div class="mb-2"><div class="flex justify-between gap-2 text-xs font-semibold"><span>${label}</span><span>${format(value)}</span></div>
      <div class="bg-gray-100 rounded h-2"><div class="h-2 rounded ${value<0?'bg-red-600':'bg-blue-700'}" style="width:${Math.abs(value)/maximum*100}%"></div></div></div>`).join('')}
    <div class="flex justify-between text-xs text-gray-500"><span>${format(0)}</span><span>${format(maximum)}</span></div></section>`;
}
function stockRolls(stock) {
  const totals={'Flex':0,'Sticker':0,'Light Board':0};
  for(const item of stock||[]){
    if(item.archived||!/^rolls?$/i.test(item.unit||''))continue;
    const name=(item.cat||'')+' '+(item.name||'');
    const category=/light[ -]?board/i.test(name)?'Light Board':/sticker|vision/i.test(name)?'Sticker':/flex/i.test(name)?'Flex':'';
    if(category)totals[category]+=Math.max(0,Number(item.bought||0)-Number(item.used||0));
  }
  return Object.entries(totals);
}

function cashierMatches(query) {
  const key=String(query||'').trim().toLowerCase();
  const compact=key.replace(/[^a-z0-9]/g,'');
  const phone=clientPhone(key);
  return (cloudData.bills||[]).filter(b=>b.status!=='Void'&&(
    !key||[b.id,b.customer,b.vehicle,...(b.items||[]).map(i=>i.name)].some(x=>String(x||'').toLowerCase().includes(key))||
    (phone&&clientPhone(b.custPhone)===phone)||
    (compact&&String(b.vehicle||'').toLowerCase().replace(/[^a-z0-9]/g,'').includes(compact))
  ));
}

function monthlyCashFlow(state) {
  const [year,month] = todayISO().split('-').map(Number);
  const months = Array.from({length:6},(_,index)=>{
    const date = new Date(Date.UTC(year,month-6+index,1));
    return {key:date.toISOString().slice(0,7),label:date.toLocaleDateString('en-LK',{month:'short',year:'2-digit',timeZone:'UTC'}),income:0,expenses:0};
  });
  const byMonth = new Map(months.map(row=>[row.key,row]));
  const add = (entries,field)=>{
    for(const entry of entries||[]){
      const row=byMonth.get(String(entry.date||'').slice(0,7));
      if(row)row[field]+=Number(entry.amount)||0;
    }
  };
  add(paymentRows(state),'income');
  add(state.bankTransfers,'income');
  add((state.extraWorks||[]).filter(entry=>!entry.voidDetails&&entry.kind!=='withdrawal'),'expenses');
  add(state.teaTransfers,'expenses');
  return months.map(row=>({...row,income:fixed(row.income),expenses:fixed(row.expenses),net:fixed(row.income-row.expenses)}));
}

  const canvas=root.querySelector('canvas');
  const ctx=canvas.getContext('2d');
  if(!ctx)return;
  const values=rows.flatMap(row=>series.map(([key])=>row[key]));
  const min=Math.min(0,...values),max=Math.max(1,...values);
  const left=92,right=850,top=24,bottom=235;
  const x=index=>left+(right-left)*index/(rows.length-1);
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top);
  const axis=new Intl.NumberFormat('en-LK',{notation:'compact',maximumFractionDigits:1});
  ctx.font='15px sans-serif';
  ctx.fillStyle='#475569';
  for(let tick=0;tick<=4;tick++){
    const value=min+(max-min)*tick/4;
    ctx.strokeStyle='#e2e8f0';
    ctx.beginPath();ctx.moveTo(left,y(value));ctx.lineTo(right,y(value));ctx.stroke();
    ctx.fillText('Rs. '+axis.format(value),5,y(value)+4);
  }
  ctx.strokeStyle='#94a3b8';
  ctx.beginPath();ctx.moveTo(left,y(0));ctx.lineTo(right,y(0));ctx.stroke();
  ctx.textAlign='center';
  rows.forEach((row,index)=>ctx.fillText(row.label,x(index),263));
  for(const [key,,color] of series){
    ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;
    ctx.beginPath();
    rows.forEach((row,index)=>{if(index===0)ctx.moveTo(x(index),y(row[key]));else ctx.lineTo(x(index),y(row[key]));});
    ctx.stroke();
    rows.forEach((row,index)=>{ctx.beginPath();ctx.arc(x(index),y(row[key]),4,0,2*Math.PI);ctx.fill();});
  }
}

const plateStages={pending:'හදන්න තියෙනවා',ready:'හදලා ඉවරයි',delivered:'භාර දීලා'};
const plateBills=state=>(state.bills||[]).filter(b=>b.status!=='Void'&&b.items?.some(isPlate));

const plateOverdue=(b,now=Date.now())=>plateStage(b)==='pending'&&Number.isFinite(b.plateOrder?.dueAt)&&b.plateOrder.dueAt<=now;
function plateDue(hours,now=Date.now()){
  const duration=Number(hours);
  if(!Number.isFinite(duration)||duration<=0||duration>8760)throw Error('භාරදීමට පැය 0ට වැඩි, 8,760ට නොවැඩි ගණනක් ඇතුළත් කරන්න.');
  return now+Math.round(duration*3600000);
}

window.radsPlateChange=async (id,action)=>{
  if(!isBillingRole()||busyCounter)return;
  try{
    let dueAt;
    if(action==='due'){
      const raw=prompt('දැන් සිට භාරදීමට පැය කීයක්ද? (උදා: 0.5 = මිනිත්තු 30)');
      if(raw===null)return;
      dueAt=plateDue(raw);
    }
    if(action==='delivered'&&!confirm('වාහන අංක තහඩුව පාරිභෝගිකයාට භාර දුන්නාද?'))return;
    await commitUpdate('Number Plate '+action,(state,person)=>{
      if(!isManagerOrCashier(person))throw Error('මෙම වෙනසට අවසර නැහැ.');
      const bill=plateBills(state).find(b=>b.id===id);
      if(!bill)throw Error('Number Plate බිල හමු වුණේ නැහැ.');
      const stage=plateStage(bill);
      const allowed=stage==='pending'?['due','ready']:stage==='ready'?['delivered']:[];
      if(!allowed.includes(action))throw Error('ඇණවුමේ තත්ත්වය වෙනස් වී තිබෙනවා.');
      bill.plateOrder||={stage};
      if(action==='due'){bill.plateOrder.dueAt=dueAt;return;}
      Object.assign(bill.plateOrder,{stage:action,[action+'At']:Date.now(),[action+'By']:person.id});
    });
  }catch(err){alert(err.message);}
};

const canUpdateStock=user=>Boolean(user&&!user.disabled);
const yardNumber=value=>new Intl.NumberFormat('en-LK',{maximumFractionDigits:3}).format(value);
function yardQuantity(raw,allowZero=false){
  if(!/^\d+(?:\.\d{1,3})?$/.test(String(raw).trim()))throw Error('වලංගු ප්‍රමාණයක් දාන්න.');
  const quantity=Number(raw);
  if(!Number.isFinite(quantity)||quantity>100000000||(!allowZero&&quantity===0))throw Error('වලංගු ප්‍රමාණයක් දාන්න.');
  return quantity;
}
function yardBalance(quantity,change,direction){
  const balance=Math.round((quantity+(direction==='in'?change:-change))*1000)/1000;
  if(balance<0)throw Error('නිකුත් කිරීමට ප්‍රමාණවත් තොග නැහැ.');
  if(!Number.isFinite(balance)||balance>100000000)throw Error('තොග ප්‍රමාණය වලංගු නැහැ.');
  return balance;
}
const yardLow=state=>(state.yardStock||[]).filter(item=>item.quantity<=item.lowAt);

window.radsYardForm=(id='',direction='')=>{
  if(!canUpdateStock(ui.user)||busyCounter)return;
  const item=id?cloudData.yardStock?.find(i=>i.id===id):null;
  if(id&&(!item||!['in','out'].includes(direction)))return;
  savedReceipt=null;
  review.innerHTML=`<h2>${item?txt(item.name)+' · '+(direction==='out'?'නිකුත් කරන්න':'ලැබුණු තොගය'):'අලුත් Yard Stock වර්ගය'}</h2>

    <label>ද්‍රව්‍යයේ නම<input name="name" maxlength="80" placeholder="G.I. බට" required></label>

    <label>කාණ්ඩය<select name="category">${YARD_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></label>

    <label>${item?'ප්‍රමාණය':'ආරම්භක තොගය'}<input name="quantity" type="number" min="${item?'0.001':'0'}" step="0.001" inputmode="decimal" required></label>
    ${direction==='out'?'<label>භාරගත් Section / කෙනා<input name="to" maxlength="80" required></label>':''}
    <label>සටහන<input name="note" maxlength="160" placeholder="Job අංකය හෝ හේතුව"></label>
    <p data-yard-error role="alert" class="text-red-700"></p>
    <button type="submit" class="rads-cash-primary">Save කරන්න</button><button type="button" data-yard-close>වසන්න</button></form>`;
  const form=review.querySelector('[data-yard-form]');
  form.querySelector('[data-yard-close]').onclick=()=>{if(!busyCounter)review.close();};
  const request=uuid();
  form.onsubmit=async event=>{
    event.preventDefault();
    if(busyCounter)return;
    const values=Object.fromEntries(new FormData(form)),submit=form.querySelector('[type=submit]');
    submit.disabled=true;
    try{
      const quantity=yardQuantity(values.quantity,!item),name=values.name?.trim(),code=values.code?.trim()||'',to=values.to?.trim()||'';
      if(!item&&!name)throw Error('ද්‍රව්‍යයේ නම දාන්න.');
      if(direction==='out'&&!to)throw Error('භාරගත් Section එක හෝ කෙනා සඳහන් කරන්න.');
      await commitUpdate('Yard Stock '+(direction||'new'),(state,person)=>{
        if(!canUpdateStock(person))throw Error('තොග වෙනස් කිරීමට අවසර නැහැ.');
        const stock=state.yardStock||=[],moves=state.yardMovements||=[];
        if(moves.some(m=>m.id===request)||stock.some(i=>i.id===request))return;
        let record;
        if(item){
          record=stock.find(i=>i.id===id);
          if(!record)throw Error('ද්‍රව්‍යය හමු වුණේ නැහැ.');
          record.quantity=yardBalance(record.quantity,quantity,direction);
        }else{
          if(stock.some(i=>i.name.toLowerCase()===name.toLowerCase()&&i.code.toLowerCase()===code.toLowerCase()))throw Error('මේ නම සහ වර්ග අංකය දැනටමත් තිබෙනවා.');
          record={id:request,name,code,category:values.category,unit:values.unit,quantity,lowAt:yardQuantity(values.lowAt,true)};
          stock.push(record);
        }
        if(quantity>0)moves.unshift({id:request,itemId:record.id,name:[record.name,record.code].filter(Boolean).join(' '),direction:direction||'in',amount:quantity,balance:record.quantity,unit:record.unit,to,note:values.note.trim(),by:person.name,at:Date.now()});
      });
      review.close();
    }catch(err){form.querySelector('[data-yard-error]').textContent=err.message;submit.disabled=false;}
  };
  if(!review.open)review.showModal();
};

const groundMaterials = ['Red PVC', 'Red Luminous', 'Blue Luminous', 'Green', 'Silver', 'Yellow', 'Tinterd'];
function groundStockRows(state) {
  const saved = state.groundFlowStock || [];
  const starter = groundMaterials.map((name, index) => {
    const id = 'starter-' + index;
    return saved.find(item => item.id === id) || { id, name, quantity: null, lowAt: null };
  });
  return [...starter, ...saved.filter(item => !starter.some(row => row.id === item.id))];
}
const groundIsLow = item => item.quantity !== null && item.lowAt !== null && item.quantity <= item.lowAt;
const groundShortage = item => Math.max(0, Math.round((item.lowAt - item.quantity) * 1000) / 1000);
function groundShortageReport(items, date) {
  return [
    'Ground Flow Stock · අඩු තොග වාර්තාව',
    'දිනය: ' + date,
    'අඩු තොග වර්ග: ' + items.length,
    '',
    ...items.map(item => `• ${item.name}: ඉතිරි ${yardNumber(item.quantity)} අඩි | අවම ${yardNumber(item.lowAt)} අඩි | සීමාවට මදි ${yardNumber(groundShortage(item))} අඩි`)
  ].join('\n');
}
function groundWhatsApp(businessState) {
  const samila = businessState.staff.find(person => !person.disabled && /\bsamila\b/i.test(person.name));
  return clientPhone(samila?.tel);
}

      ${canEdit ? '<button type="button" class="rads-cash-primary" onclick="radsGroundStockChange()">+ Material එකතු කරන්න</button>' : ''}

window.radsGroundWhatsApp = () => {
  if (!canUpdateStock(ui.user)) return;
  const phone = groundWhatsApp(cloudData);
  if (!phone) return alert('Samilaගේ Staff Profile එකට WhatsApp අංකය ඇතුළත් කරන්න.');
  const low = groundStockRows(cloudData).filter(groundIsLow);
  if (!low.length) return;

window.radsGroundStockChange = async (action = 'new', id = '') => {
  if (!canUpdateStock(ui.user) || busyCounter) return;
  if (!['new', 'setup', 'in', 'out', 'limit', 'adjust'].includes(action)) return;
  const current = groundStockRows(cloudData).find(item => item.id === id);
  if (action !== 'new' && !current) return;
  const name = action === 'new' ? prompt('Material නම')?.trim() : current.name;
  if (!name) return;
  try {
    if (name.length > 80) throw Error('Material නම අකුරු 80කට සීමා කරන්න.');
    const isSetup = action === 'new' || action === 'setup';
    const prompts = {
      limit: ['අඩු තොග සීමාව (අඩි)', current?.lowAt],
      adjust: ['දැනට තියෙන සම්පූර්ණ අඩි ගණන', current?.quantity],
      in: ['ලැබුණු අඩි ගණන', ''],
      out: ['භාවිත කළ අඩි ගණන', '']
    };
    const raw = prompt(...(isSetup ? ['ආරම්භක තොගය (අඩි)', ''] : prompts[action]));
    if (raw === null) return;
    const amount = yardQuantity(raw, isSetup || action === 'limit' || action === 'adjust');
    const limit = isSetup ? prompt('අඩු තොග සීමාව (අඩි)', '0') : null;
    if (isSetup && limit === null) return;
    const lowAt = isSetup ? yardQuantity(limit, true) : null;
    const newId = action === 'new' ? uuid() : id;
    await commitUpdate('Ground Flow Stock · ' + name + ' · ' + action + ' · ' + amount + ' ft', (state, person) => {
      if (!canUpdateStock(person)) throw Error('තොග වෙනස් කිරීමට අවසර නැහැ.');
      const saved = state.groundFlowStock ||= [];
      const rows = groundStockRows(state);
      if (action === 'new') {
        if (rows.some(item => item.name.toLowerCase() === name.toLowerCase())) throw Error('මේ Material එක දැනටමත් තිබෙනවා.');
        saved.push({ id: newId, name, quantity: amount, lowAt });
        return;
      }
      const item = rows.find(row => row.id === id);
      if (!item) throw Error('Material එක හමු වුණේ නැහැ.');
      if (action === 'setup') {
        if (item.quantity !== null) throw Error('ආරම්භක තොගය දැනටමත් ඇතුළත් කර තිබෙනවා.');
        saved.push({ ...item, quantity: amount, lowAt });
        return;
      }
      if (item.quantity === null) throw Error('මුලින් ආරම්භක තොගය දාන්න.');
      if (action === 'limit') item.lowAt = amount;
      else if (action === 'adjust') {
        if (item.quantity !== current.quantity) throw Error('තොගය වෙනස් වී තිබෙනවා. අලුත් ගණන බලලා නැවත උත්සාහ කරන්න.');
        item.quantity = amount;
      } else item.quantity = yardBalance(item.quantity, amount, action);
    });
  } catch (error) {
    alert(error.message);
  }
};

    main.insertAdjacentHTML('afterbegin','<button type="button" id="rads-plate-alert" hidden class="m-3 rounded bg-red-100 text-red-900 p-2 font-bold"></button>');
    document.getElementById('rads-plate-alert').onclick=radsOpenPlates;
    main.querySelectorAll('[data-plate-action]').forEach(button=>{button.onclick=()=>{
      const id=button.closest('[data-plate-bill]').dataset.plateBill,action=button.dataset.plateAction;
      if(action==='view')return radsShowBill(id);
      if(action==='collect')return collectPayment(id);
      radsPlateChange(id,action);
    };});
    refreshPlateAlerts();
  }
  const stockSearch=document.getElementById('rads-stock-search');
  if(stockSearch){
    const filter=()=>{
      ui.stockSearch=stockSearch.value;
      const query=stockSearch.value.trim().toLowerCase();
      main.querySelectorAll('[data-stock-search]').forEach(row=>{row.hidden=!row.dataset.stockSearch.toLowerCase().includes(query);});
    };
    stockSearch.oninput=filter;
    filter();
  }
  if (ui.page === 'ground-flow-stock' && main) {
    const search = main.querySelector('[data-ground-search]');
    const rows = main.querySelectorAll('[data-ground-item]');
    search.value = ui.groundStockSearch || '';
    search.oninput = () => {
      ui.groundStockSearch = search.value;
      const query = search.value.trim().toLowerCase();
      rows.forEach(row => { row.hidden = !row.dataset.groundItem.toLowerCase().includes(query); });
    };
    search.oninput();
    main.querySelectorAll('[data-ground-action]').forEach(button => {
      button.onclick = () => radsGroundStockChange(button.dataset.groundAction, button.closest('tr').dataset.groundId);
    });
  }
  if(ui.page==='yard'){
    main?.querySelectorAll('[data-yard-id]').forEach(button=>{button.onclick=()=>radsYardForm(button.dataset.yardId,button.dataset.yardMode);});
  }
  if(ui.page==='dashboard'){
    main?.insertAdjacentHTML('afterbegin',`<div class="mx-3 mt-3 p-3 bg-white border rounded-xl"><button type="button" class="font-bold underline" onclick="setPage('yard')">Yard Stock</button> · ${(cloudData.yardStock||[]).length} වර්ග · අඩු තොග ${yardLow(cloudData).length}</div>`);
  }
  const bossCashFlow=document.getElementById('boss-cash-flow');
  if(bossCashFlow)renderCashFlowMonitor(bossCashFlow);
  if(ui.page==='sales')bindSalesReport();
  if(ui.page==='report'&&isBillingRole()){
    const report=document.getElementById('report-print-area');
    if(report){
      const monitor=document.createElement('div');
      report.before(monitor);
      renderCashFlowMonitor(monitor);
    }
  }
  if(isBillingRole()&&!ui.tvMode){
    const quick=document.createElement('button');
    quick.type='button';quick.className='rads-quick-bill';quick.textContent='🖨️ Bill +';
    quick.setAttribute('aria-label','Bill + — අලුත් බිලක් සාදන්න');
    quick.onclick=()=>{if(ui.page!=='newbill')setPage('newbill');document.getElementById('bill_cust_name')?.focus();};
    document.getElementById('app').append(quick);
    if(ui.page==='cashier'){
      const home=document.querySelector('#app main > div');
      home?.insertAdjacentHTML('afterbegin',smartCashierMarkup());
      home?.insertAdjacentHTML('beforeend',pettyMarkup());
      const pane=home?.querySelector('.rads-smart-cash');
      if(pane)bindSmartCashier(pane);
      pane?.querySelectorAll('[data-monitor-counter]').forEach(button=>{
        button.onclick=()=>{
          const counter=button.dataset.monitorCounter;
          if(!Object.hasOwn(cashierFloors(),counter))return;
          ui.selectedCashierFloor=counter;
          ui.draftBill.floor=counter;
          render();
        };
      });
      home?.querySelectorAll('[data-petty-id]').forEach(button=>{button.onclick=()=>radsSettlePetty(button.dataset.pettyId);});
    }
  }
  if(isBossOrFamily(ui.user))bindBulkSelection(main);
  if(ui.page==='newbill'){
    const d=ui.draftBill;
    const holder=document.getElementById('rads-extra-bill');
    if(holder){
      const plateIndex=d.items.findIndex(isPlate);
      const plate=d.items[plateIndex];
      const vehicle=vehicleParts(d.vehicle);
      holder.innerHTML=`<div class="rads-actions"><button onclick="radsBillButton('plate')">Number Plate</button><button onclick="radsOpenPlates()">Plate History</button><button onclick="radsBillButton('paid')">සම්පූර්ණ ගෙවීම</button><button onclick="radsBillButton('unpaid')">ගෙවීමක් නැහැ</button></div>
      <div class="grid sm:grid-cols-3 gap-2"><label>ශාඛාව<select id="rads-branch">${branches.map(b=>`<option${(d.branch||branches[0])===b?' selected':''}>${b}</option>`).join('')}</select></label>
      <label>Title<select id="rads-title">${['','Mr.','Mrs.','Ms.'].map(t=>`<option${(d.title||'')===t?' selected':''}>${t}</option>`).join('')}</select></label>
      </div>
      ${plate?`<div class="grid grid-cols-2 sm:grid-cols-4 gap-2"><label>පළාත් කේතය<input id="rads-plate-province" maxlength="2" autocapitalize="characters" placeholder="NC" value="${txt(vehicle.province)}"></label>
      <label>අකුරු 2–3<input id="rads-plate-prefix" maxlength="3" autocapitalize="characters" placeholder="AWB" value="${txt(vehicle.prefix)}"></label>
      <label>අංක 4<input id="rads-plate-number" maxlength="4" inputmode="numeric" placeholder="2020" value="${txt(vehicle.number)}"></label>
      <label>Plate මිල (Rs.)<input id="rads-plate-price" type="number" min="0.01" step="0.01" value="${plate.price||''}"></label>
      <label>භාරදීමට පැය<input id="rads-plate-hours" type="number" min="0.01" max="8760" step="0.01" value="${txt(d.plateHours)}" placeholder="උදා: 2"></label></div>`:''}<label><input type="checkbox" id="rads-job"${d.createJob?' checked':''}> Bill එකට Job එකක් සාදන්න</label>`;
      for(const [id,key] of [['rads-branch','branch'],['rads-title','title']])document.getElementById(id).oninput=e=>{d[key]=e.target.value;recalcBillLive();};
      if(plate){
        document.getElementById('rads-plate-hours').oninput=e=>{d.plateHours=e.target.value;};
        const province=document.getElementById('rads-plate-province');
        const prefix=document.getElementById('rads-plate-prefix'), number=document.getElementById('rads-plate-number'), price=document.getElementById('rads-plate-price');
        const updateVehicle=()=>{
          province.value=province.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,2);
          prefix.value=prefix.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
          number.value=number.value.replace(/[^0-9]/g,'').slice(0,4);
          d.vehicle=((province.value?province.value+'-':'')+prefix.value+' '+number.value).trim();
          recalcBillLive();
        };
        province.oninput=prefix.oninput=number.oninput=updateVehicle;
        province.onkeydown=e=>handleBillEnter(e,'rads-plate-prefix');
        prefix.onkeydown=e=>handleBillEnter(e,'rads-plate-number');
        number.onkeydown=e=>handleBillEnter(e,'rads-plate-price');
        const unitPrice=document.getElementById('draftBill_price_'+plateIndex);
        price.oninput=()=>{plate.price=Number(price.value||0);if(unitPrice)unitPrice.value=price.value;syncBillPreviewItems();};
        unitPrice?.addEventListener('input',()=>{price.value=unitPrice.value;});
      }
      document.getElementById('rads-job').onchange=e=>{d.createJob=e.target.checked;recalcBillLive();};
    }
  }
};
window.render = render;

  let dashboardDate = todayISO();
  function refreshDashboardDate() {
    const date = todayISO();
    if(date===dashboardDate||!ui.user||(ui.page!=='dashboard'&&!ui.tvMode))return;
    render();
    dashboardDate=date;
  }
  window.setInterval(()=>{refreshDashboardDate();refreshTuesdayReminder();refreshPlateAlerts();},15000);
  window.addEventListener('pageshow',refreshDashboardDate);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden)refreshDashboardDate();
  });

  render();
</script>
</body>
</html>
