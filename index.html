  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSoundEffect(type) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const playTone = (freq, start, dur, wave = 'sine', gainVal = 0.25) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, now + start);
        gain.gain.setValueAtTime(gainVal, now + start);
        gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + start);
        osc.stop(now + start + dur);
      };

      if (type === 'cashIn') {
        playTone(987.77, 0, 0.14, 'triangle', 0.3);
        playTone(1318.51, 0.12, 0.35, 'triangle', 0.35);
      } else if (type === 'cashOut') {
        playTone(523.25, 0, 0.15, 'sine', 0.25);
        playTone(392.00, 0.14, 0.28, 'sine', 0.25);
      } else if (type === 'printOrder') {
        playTone(880, 0, 0.12, 'square', 0.2);
        playTone(880, 0.16, 0.12, 'square', 0.2);
        playTone(1174.66, 0.32, 0.28, 'square', 0.25);

        playTone(1318.51, 0.28, 0.35, 'sine', 0.3);
      }
    } catch (e) {}
  }

  function calcCashierBalances() {
    const today = getColomboDate();
    const res = { Ground: 0, Upper: 0, Counter3: 0, Total: 0, todayCashIncome: 0, todayBankIncome: 0, todayExpenses: 0, todayTeaDeducted: 0 };

    cloudData.bills.filter(b => b.date === today && b.status !== 'Pending').forEach(b => {
      const cashAmt = Number(b.advance || 0);
      const bankAmt = Number(b.bankPaid || 0);
      if (b.payMethod === 'Bank Transfer' && bankAmt === 0) {
        res.todayBankIncome += cashAmt;
      } else {
        res.todayCashIncome += cashAmt;
        res.todayBankIncome += bankAmt;
        if (res[b.floor] !== undefined) res[b.floor] += cashAmt;
        else res.Ground += cashAmt;
      }
    });

    (cloudData.bankTransfers || []).filter(bt => bt.date === today).forEach(bt => {
      res.todayBankIncome += Number(bt.amount || 0);
    });

    cloudData.extraWorks.filter(e => e.date === today).forEach(e => {
      const amt = Number(e.amount || 0);
      res.todayExpenses += amt;
      if (res[e.floor] !== undefined) res[e.floor] -= amt;
      else res.Ground -= amt;
    });

    (cloudData.teaTransfers || []).filter(t => t.date === today).forEach(t => {
      const amt = Number(t.amount || 0);
      res.todayTeaDeducted += amt;
      if (res[t.floor] !== undefined) res[t.floor] -= amt;
      else res.Ground -= amt;
    });

    res.Total = res.Ground + res.Upper + res.Counter3;
    return res;
  }

  function calcMonthlyStats() {
    const monthPrefix = getCurrentMonthPrefix();
    let mIncome = 0, mExpenses = 0, mTea = 0, totalCustomerDues = 0;

    cloudData.bills.forEach(b => {
      if (b.date.startsWith(monthPrefix) && b.status !== 'Pending') {
        mIncome += Number(b.advance || 0) + Number(b.bankPaid || 0);
      }
      if (b.balance > 0) totalCustomerDues += Number(b.balance || 0);
    });
    (cloudData.bankTransfers || []).filter(bt => bt.date.startsWith(monthPrefix)).forEach(bt => mIncome += Number(bt.amount || 0));
    cloudData.extraWorks.filter(e => e.date.startsWith(monthPrefix)).forEach(e => mExpenses += Number(e.amount || 0));
    (cloudData.teaTransfers || []).filter(t => t.date.startsWith(monthPrefix)).forEach(t => mTea += Number(t.amount || 0));

    return {
      mIncome,
      mExpenses: mExpenses + mTea,
      mNet: mIncome - (mExpenses + mTea),
      totalCustomerDues
    };
  }

      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const maxDim = 150;
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
        else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

        const me = cloudData.staff.find(x => x.id === ui.user.id);
        if (me) {
          me.photo = compressedDataUrl;
          ui.user.photo = compressedDataUrl;
          await saveCloud(`${me.name} updated profile photo`);
          render();

      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);

  window.onBillItemSelect = (idx, val, target = 'draftBill') => {
    const item = ui[target].items[idx];
    item.baseName = val;
    item.manualRate = false;
    const rateObj = cloudData.rates.find(r => r.name.toLowerCase() === val.toLowerCase());
    if (rateObj) {
      if (rateObj.isSqft) {
        const w = Number(item.w || 1), h = Number(item.h || 1);
        const sqft = w * h;
        const unitRate = sqft < 10 ? rateObj.u10m : rateObj.u10p;
        item.rate = unitRate;
        item.price = Math.round(sqft * unitRate);
        item.name = `${rateObj.name} ${w}x${h}`;
      } else {
        item.w = ''; item.h = ''; item.rate = rateObj.u10m || 0;
        item.price = rateObj.u10m || item.price || 0;
        item.name = rateObj.name;
      }
    } else {
      item.name = val;
    }
    render();
    setTimeout(() => {

      if (nextEl) { nextEl.focus(); nextEl.select(); }

  window.onBillSizeOrRateChange = (idx, target = 'draftBill', source = 'size') => {
    const item = ui[target].items[idx];
    const rateObj = cloudData.rates.find(r => r.name.toLowerCase() === (item.baseName || '').toLowerCase());
    const w = Number(item.w || 0), h = Number(item.h || 0);

    if (source === 'rate') {
      item.manualRate = true;
    }

    if (w > 0 && h > 0) {
      const sqft = w * h;
      if (!item.manualRate && rateObj && rateObj.isSqft) {
        item.rate = sqft < 10 ? rateObj.u10m : rateObj.u10p;
      }
      const activeRate = Number(item.rate || 0);
      if (activeRate > 0) {
        item.price = Math.round(sqft * activeRate);
      }
      item.name = item.baseName ? `${item.baseName} ${w}x${h}` : `${w}x${h}`;
    } else if (Number(item.rate) > 0 && source === 'rate') {
      item.price = Number(item.rate);
    }

    const rateInput = document.getElementById(`${target}_rate_${idx}`);
    if (rateInput && source !== 'rate') rateInput.value = item.rate || '';
    const priceInput = document.getElementById(`${target}_price_${idx}`);

  window.saveNewBill = async (printAfter = false) => {
    const d = ui.draftBill;
    const itemsTotal = d.items.reduce((acc, it) => acc + (Number(it.qty) * Number(it.price)), 0);
    const total = itemsTotal + Number(d.serviceCharge || 0);
    if (total <= 0) return alert('කරුණාකර බිලට අයිතම සහ මිල ඇතුළත් කරන්න.');

    const adv = d.pending ? 0 : Number(d.advance || 0);
    const bal = Math.max(0, total - adv);
    const status = d.pending ? 'Pending' : (bal <= 0 ? 'FULL PAID' : 'Balance Due');
    const nextNum = String(cloudData.bills.length + 1).padStart(3, '0');
    const billId = 'RADS-' + nextNum;

    const isBankDirect = d.payMethod === 'Bank Transfer';

    const newBill = {
      id: billId,
      date: getColomboDate(),
      customer: d.customer || '-',
      custPhone: d.custPhone || '',
      cashier: ui.user.name,
      floor: d.floor,
      payMethod: d.payMethod,
      items: JSON.parse(JSON.stringify(d.items)),
      serviceCharge: Number(d.serviceCharge || 0),
      serviceNote: d.serviceNote,
      total,
      advance: isBankDirect ? 0 : adv,
      bankPaid: isBankDirect ? adv : 0,
      balance: bal,
      status
    };

    cloudData.bills.unshift(newBill);

    if (d.customer && d.customer !== '-' && d.customer.length > 2) {
      cloudData.clientsDir = cloudData.clientsDir || [];
      const existing = cloudData.clientsDir.find(c => c.name.toLowerCase() === d.customer.toLowerCase());
      if (existing) { existing.jobsCount = (existing.jobsCount || 1) + 1; if (d.custPhone) existing.phone = d.custPhone; }
      else { cloudData.clientsDir.push({ name: d.customer, phone: d.custPhone || '', addr: 'Medirigiriya', jobsCount: 1 }); }
    }

    if (bal === 0) {
      cloudData.jobs.forEach(j => {
        if (j.billNo && j.billNo.toUpperCase() === billId) j.steps.Payment = true;
      });
    }

    if (adv > 0 && d.payMethod === 'Cash') playSoundEffect('cashIn');
    await saveCloud(`Created Bill ${billId} (${d.payMethod}, Rs. ${total}, ${status})`);

    if (printAfter) {
      setTimeout(() => {
        window.print();
        ui.draftBill = {
          customer: '', custPhone: '', date: getColomboDate(), cashier: ui.user.name, floor: ui.selectedCashierFloor, payMethod: 'Cash',
          items: [{ baseName: '', w: '', h: '', rate: '', manualRate: false, name: '', qty: 1, price: 0 }], pending: false, serviceCharge: 0, serviceNote: '', advance: 0
        };

  window.collectPayment = async (billId) => {
    const bill = cloudData.bills.find(b => b.id === billId);
    if (!bill) return;
    const amtStr = prompt(`${bill.id} (Balance: Rs. ${bill.balance}) සඳහා ගෙවූ මුදල ඇතුළත් කරන්න:`, bill.balance);
    if (!amtStr) return;
    const paid = Number(amtStr);
    if (isNaN(paid) || paid <= 0) return;

    const isBank = confirm(`මෙම Rs. ${paid} ලැබුණේ BANK TRANSFER එකක් විදියටද?\n\n[OK] = Bank Transfer (Cashier එකට එකතු නොවේ)\n[Cancel] = Cash (Cashier Register එකට එකතු වේ)`);

    if (isBank) {
      bill.bankPaid = (bill.bankPaid || 0) + paid;
      bill.payMethod = 'Bank Transfer';
    } else {
      bill.advance = (bill.advance || 0) + paid;
      playSoundEffect('cashIn');
    }

    const totalPaid = (bill.advance || 0) + (bill.bankPaid || 0);
    bill.balance = Math.max(0, bill.total - totalPaid);
    bill.status = bill.balance === 0 ? 'FULL PAID' : 'Balance Due';

    cloudData.jobs.forEach(j => {
      if (j.billNo && j.billNo.toUpperCase() === bill.id.toUpperCase() && bill.balance === 0) {
        j.steps.Payment = true;
      }
    });

    await saveCloud(`Collected Rs. ${paid} (${isBank ? 'Bank Transfer' : 'Cash'}) for ${bill.id}`);
    render();
  };

      const qtyStr = prompt(`${st.name} (ඉතුරු: ${st.bought - st.used}) — අලුතින් ගත්ත ගණන:`, '1');

      if (!qty || qty <= 0) return;
      st.bought += qty;
      await saveCloud(`Added +${qty} to Stock: ${st.name}`);
    } else {
      const rem = st.bought - st.used;
      if (rem <= 0) return alert(`❌ ${st.name} තොගය 0 කි!`);
      st.used += 1;
      const newRem = st.bought - st.used;
      await saveCloud(`Used 1 ${st.name} (Remaining: ${newRem})`);
      if (newRem <= 1) {
        playSoundEffect('specialAlert');
        alert(`⚠️ LOW STOCK ALERT!\n"${st.name}" තව ඉතුරු වී ඇත්තේ ${newRem} ක් පමණි! ඉක්මනින් ඇණවුම් කරන්න.`);

  window.parseFingerprintFile = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const lines = e.target.result.split(/\r?\n/).filter(Boolean);
      const parsed = [];
      lines.slice(1).forEach(line => {
        const cols = line.split(',');
        if (cols.length >= 4) {
          const name = cols[0].trim();
          const date = cols[1].trim();
          const inTime = cols[2].trim();
          const outTime = cols[3].trim();
          let otHours = 0;
          if (outTime && outTime.includes(':')) {
            const [oh, om] = outTime.split(':').map(Number);
            if (oh >= 18) otHours = Number(((oh - 18) + (om / 60)).toFixed(2));
          }
          parsed.push({ name, date, inTime, outTime, otHours });
        }
      });
      ui.fpRecords = parsed;
      alert(`✅ Fingerprint File කියවා අවසන්! (Zero Cloud Storage Used)\nවාර්තා ${parsed.length}ක් හමුවිය.`);
      render();
    };
    reader.readAsText(file);
  };

                <div>
                  <span class="font-black text-sm">${l.name}</span>
                  <span class="bg-gray-100 px-2 py-0.5 rounded font-bold ml-1">${l.leaveType || 'Leave'}</span>
                  <span class="text-gray-700 font-bold ml-1">• ${l.date}</span>
                  <div class="text-gray-600 mt-0.5">හේතුව: ${l.reason} ${l.approvedBy ? `<span class="text-emerald-700 font-bold">(By: ${l.approvedBy})</span>` : ''}</div>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="px-2.5 py-1 rounded-full font-black text-[11px] ${badgeCls}">${st}</span>
                  ${isBoss && st === 'Pending Boss Approval' ? `
                    <button onclick="approveOrRejectLeave(${l.id}, 'Approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg font-black">✅ Approve</button>
                    <button onclick="approveOrRejectLeave(${l.id}, 'Rejected')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded-lg font-black">✕ Reject</button>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderMessagesAndChat() {
    const u = ui.user;
    const msgs = cloudData.teamMessages || [];

    return `
      <div class="max-w-5xl mx-auto p-4 space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow border space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h2 class="font-black text-sm text-[#E31E24]">💬 OFFICE TEAM CHAT (Logged-in Sender Name on Top)</h2>
            <span class="text-[11px] font-bold text-gray-500">Sending as: <b>${u.name} (${u.id})</b></span>
          </div>

          <div class="flex gap-2">
            <input id="team_msg_input" type="text" placeholder="පණිවිඩයක් ලියන්න (Message)..."
              onkeydown="if(event.key==='Enter') sendTeamMessage()"
              class="w-full border rounded-xl px-3 py-2 text-xs font-bold bg-gray-50 focus:bg-white" />
            <button onclick="sendTeamMessage()" class="bg-[#E31E24] hover:bg-red-700 text-white font-black px-5 py-2 rounded-xl text-xs shrink-0">Send ➤</button>
          </div>

          <div class="max-h-72 overflow-y-auto space-y-2.5 bg-gray-100 p-3 rounded-xl border">
            ${msgs.length === 0 ? `<p class="text-xs text-gray-500 text-center py-4">තවම පණිවිඩ නොමැත. පළමු පණිවිඩය යවන්න!</p>` : ''}
            ${msgs.map(m => {
              const isMe = m.senderId === u.id;
              return `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                  <span class="text-[11px] font-black text-gray-700 mb-0.5 px-1">
                    👤 ${m.senderName} <span class="text-[10px] font-bold text-gray-500">(${m.senderId} • ${m.time})</span>
                  </span>
                  <div class="max-w-[85%] px-3.5 py-2 rounded-2xl text-xs font-semibold shadow-xs ${
                    isMe ? 'bg-[#111111] text-white rounded-tr-none' : 'bg-white text-gray-900 border rounded-tl-none'
                  }">
                    ${m.text}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow border space-y-2">
          <h2 class="font-black text-sm text-emerald-800">📲 1-CLICK WHATSAPP STAFF UPDATES</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${cloudData.staff.map(s => {
              const rem = s.teaEarned - s.teaTaken;
              const msg = `📋 *ROSHAN ADVERTISING UPDATE (${getColomboDate()})*\n👤 *${s.name} (${s.id})*\n☕ Tea Balance: Rs.${rem} | Leaves: ${s.leaves || 0}`;
              return `<div class="border rounded-xl p-2.5 bg-gray-50 flex justify-between items-center text-xs">
                <div><b>${s.name}</b> (${s.tel || 'No Tel'})</div>
                <button onclick="${s.tel ? `openWhatsApp('${s.tel}', \`${msg}\`)` : `alert('WhatsApp Number නැත')`}" class="bg-emerald-600 text-white px-2.5 py-1 rounded font-bold">📲 WhatsApp</button>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow border space-y-2">
          <h3 class="font-black text-sm">🛕 REPEAT TEMPLES, SHOPS & COMPANIES DIRECTORY</h3>
          ${(cloudData.clientsDir || []).map(c => `<div class="flex justify-between text-xs border-b py-1.5"><span><b>${c.name}</b> (${c.phone || '-'})</span><span class="font-bold text-gray-500">Orders: ${c.jobsCount}</span></div>`).join('')}
        </div>
      </div>
    `;
  }

  function render() {
    const appEl = document.getElementById('app');
    if (!ui.splashDone) {
      appEl.innerHTML = renderSplash();
      return;
    }
    if (!ui.user) {
      appEl.innerHTML = renderLogin();
      return;
    }
    if (ui.tvMode && isBossOrFamily(ui.user)) {
      appEl.innerHTML = renderTVMonitor();
      return;
    }

    let body = '';
    switch (ui.page) {
      case 'dashboard': body = renderDashboard(); break;
      case 'newbill': body = renderNewBill(); break;
      case 'cashier': body = renderCashierHome(); break;
      case 'jobs': body = renderJobs(); break;
      case 'printqueue': body = renderPrintQueue(); break;
      case 'quotation': body = renderQuotation(); break;
      case 'tea': body = renderTeaMoney(); break;
      case 'stock': body = renderStock(); break;
      case 'bookings': body = renderBookings(); break;
      case 'payroll': body = renderPayrollAndFingerprint(); break;
      case 'report': body = renderDailyReport(); break;
      case 'profile': body = renderProfile(); break;
      case 'leave': body = renderLeaveRoster(); break;
      case 'messages': body = renderMessagesAndChat(); break;
      case 'rates': body = renderRateCard(); break;
      case 'pending':
        const pBills = cloudData.bills.filter(b => b.status === 'Pending' || b.status === 'Balance Due');
        body = `<div class="max-w-4xl mx-auto p-4 bg-white rounded-2xl shadow border mt-4 space-y-2">
          <h2 class="font-black text-base">⏳ PENDING & ණය BILLS (${pBills.length})</h2>
          ${pBills.map(b => `<div class="flex justify-between items-center border-b py-2 text-xs"><span><b>${b.id}</b> (${b.customer}) — Due: <b class="text-red-600">Rs.${b.balance}</b></span><button onclick="collectPayment('${b.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold">Collect</button></div>`).join('')}
        </div>`;
        break;
      default:
        body = renderDashboard();
    }

    const pinnedSidebarHTML = ui.sidebarPinned ? `
      <aside class="hidden lg:block w-64 shrink-0 bg-gradient-to-b from-[#141414] to-[#0a0a0a] text-white min-h-[calc(100vh-52px)] p-3.5 border-r border-gray-800 sticky top-[52px] self-start max-h-[calc(100vh-52px)] overflow-y-auto">
        <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-gray-800">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#E31E24]"></span>
            <span class="font-black text-[11px] tracking-wider text-gray-300">QUICK MENU</span>
          </div>
          <button onclick="ui.sidebarPinned=false; render();" title="Hide Menu" class="text-[10px] bg-white/10 hover:bg-[#E31E24] px-2 py-0.5 rounded font-bold">Hide</button>
        </div>
        <div class="space-y-1.5">
          ${renderNavButtonsList()}
        </div>
      </aside>
    ` : '';

    appEl.innerHTML = `
      ${renderTopBarAndAlerts()}
      <div class="flex">
        ${pinnedSidebarHTML}
        <main class="flex-1 min-w-0 pb-10">
          ${body}
        </main>
      </div>
    `;
  }

  render();
</script>
</body>
</html>
