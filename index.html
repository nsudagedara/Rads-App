  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSoundEffect(type) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const playTone = (freq, start, dur, wave = 'sine', gainVal = 0.25) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, now + start);
        gain.gain.setValueAtTime(gainVal, now + start);
        gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + start);
        osc.stop(now + start + dur);
      };
      if (type === 'cashIn') { playTone(987.77, 0, 0.14, 'triangle', 0.3); playTone(1318.51, 0.12, 0.35, 'triangle', 0.35); }
      else if (type === 'cashOut') { playTone(523.25, 0, 0.15, 'sine', 0.25); playTone(392.00, 0.14, 0.28, 'sine', 0.25); }

    } catch (e) {}
  }

  }
  function renderPrintQueue() { const dp = ui.draftPrint; return `<div class="max-w-6xl mx-auto p-4 space-y-4"><div class="bg-white p-4 rounded-2xl shadow border"><h2 class="font-black text-sm">🖨 SEND PRINT ORDER</h2><div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-3"><input type="text" value="${dp.jobId}" oninput="ui.draftPrint.jobId=this.value;" placeholder="Job No" class="border rounded-lg px-2.5 py-1.5 text-xs font-black" /><input type="text" value="${dp.filePath}" oninput="ui.draftPrint.filePath=this.value;" class="col-span-2 border rounded-lg px-2.5 py-1.5 text-xs font-bold bg-amber-50" /></div><button onclick="submitPrintOrder()" class="mt-3 bg-[#E31E24] text-white font-black px-5 py-2 rounded-xl text-xs">🚀 Send</button></div><div class="bg-white p-4 rounded-2xl shadow border space-y-2"><h3 class="font-black text-sm">QUEUE (${(cloudData.printQueue || []).length})</h3>${(cloudData.printQueue || []).map(pq => `<div class="border rounded-2xl p-3 ${pq.status === 'Pending Print' ? 'bg-amber-50' : 'bg-emerald-50'}"><div class="flex justify-between"><span class="bg-black text-white text-xs font-black px-2 py-0.5 rounded">${pq.id}</span><span class="text-xs font-black ${pq.status==='Printed'?'text-emerald-600':'text-amber-600'}">${pq.status}</span></div><div class="text-xs mt-1">${pq.filePath}</div>${pq.status==='Pending Print' ? `<button onclick="markPrintOrderDone('${pq.id}')" class="mt-2 bg-emerald-600 text-white px-3 py-1 rounded text-xs">✅ Printed</button>` : ''}</div>`).join('')}</div></div>`; }
  function renderCashierHome() { const bals = calcCashierBalances(); return `<div class="max-w-6xl mx-auto p-4"><div class="bg-white p-4 rounded-2xl shadow">Cashier - Ground Rs.${bals.Ground} | Upper Rs.${bals.Upper} | Total Rs.${bals.Total}</div></div>`; }
  function renderJobs() { return `<div class="max-w-7xl mx-auto p-4"><div class="bg-white p-4 rounded-2xl">Jobs: ${cloudData.jobs.length}</div></div>`; }
  function renderQuotation() { const dq = ui.draftQuote; const total = dq.items.reduce((s,it)=>s+it.qty*it.price,0); return `<div class="max-w-5xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4"><div class="lg:col-span-6 bg-white p-4 rounded-2xl"><h2 class="font-black text-sm">QUOTATION</h2><div class="mt-3">Total Rs.${total}</div><button onclick="downloadZeroStoragePDF('quote_pdf_box','Quotation.pdf')" class="mt-3 bg-[#E31E24] text-white px-4 py-2 rounded-xl text-xs">📄 Download</button></div><div id="quote_pdf_box" class="lg:col-span-6 bg-white p-5 rounded-xl border"><div class="font-black">ROSHAN ADVERTISING - QUOTATION Rs.${total}</div></div></div>`; }
  function renderRateCard() { return `<div class="max-w-5xl mx-auto p-4"><div class="bg-white p-4 rounded-2xl">Rate Card ${cloudData.rates.length} items</div></div>`; }
  function renderTeaMoney() { return `<div class="max-w-5xl mx-auto p-4"><div class="bg-white p-4 rounded-2xl">Tea Purse Rs.${cloudData.teaPurse}</div></div>`; }
  function renderStock() { return `<div class="max-w-5xl mx-auto p-4 bg-white rounded-2xl">Stock ${cloudData.stock.length}</div>`; }
  function renderBookings() { return `<div class="max-w-5xl mx-auto p-4 bg-white rounded-2xl">Bookings</div>`; }
  function renderPayrollAndFingerprint() { return `<div class="max-w-6xl mx-auto p-4 bg-white rounded-2xl">Payroll</div>`; }
  function renderDailyReport() {
    const today = getColomboDate(); const bals = calcCashierBalances();
    return `<div class="max-w-4xl mx-auto p-4 space-y-4"><div class="bg-white p-4 rounded-2xl flex justify-between"><h2 class="font-black">6PM Report</h2><div class="flex gap-2"><button onclick="document.body.classList.add('report-printing'); window.print(); setTimeout(()=>document.body.classList.remove('report-printing'), 1000);" class="bg-black text-white px-3 py-1.5 rounded-lg text-xs">🖨 Print A4</button></div></div><div id="report-print-area" class="bg-white p-6 rounded-2xl border"><h3 class="font-black">Daily Report ${today}</h3><div>Cash Rs.${bals.Total} | Bank Rs.${bals.todayBankIncome}</div></div></div>`;
  }
  function renderProfile() { const u = ui.user; return `<div class="max-w-2xl mx-auto p-4 bg-white rounded-2xl"><h2 class="font-black">${u.name}</h2><button onclick="logout()" class="bg-[#E31E24] text-white px-4 py-2 rounded-xl text-xs mt-3">Logout</button></div>`; }
  function renderLeaveRoster() { return `<div class="max-w-5xl mx-auto p-4 bg-white rounded-2xl">Leave Roster</div>`; }
  function renderMessagesAndChat() { return `<div class="max-w-5xl mx-auto p-4 bg-white rounded-2xl">Team Chat</div>`; }

  function render() {
    const appEl = document.getElementById('app');
    if (!ui.splashDone) { appEl.innerHTML = renderSplash(); return; }
    if (!ui.user) { appEl.innerHTML = renderLogin(); return; }
    if (ui.tvMode && isBossOrFamily(ui.user)) { appEl.innerHTML = renderTVMonitor(); return; }
    let body = '';
    switch (ui.page) {
      case 'dashboard': body = renderDashboard(); break;
      case 'newbill': body = renderNewBill(); break;
      case 'cashier': body = renderCashierHome(); break;
      case 'jobs': body = renderJobs(); break;
      case 'printqueue': body = renderPrintQueue(); break;
      case 'quotation': body = renderQuotation(); break;
      case 'tea': body = renderTeaMoney(); break;
      case 'stock': body = renderStock(); break;
      case 'bookings': body = renderBookings(); break;
      case 'payroll': body = renderPayrollAndFingerprint(); break;
      case 'report': body = renderDailyReport(); break;
      case 'profile': body = renderProfile(); break;
      case 'leave': body = renderLeaveRoster(); break;
      case 'messages': body = renderMessagesAndChat(); break;
      case 'rates': body = renderRateCard(); break;
      case 'pending': const pBills = cloudData.bills.filter(b => b.status === 'Pending' || b.status === 'Balance Due'); body = `<div class="max-w-4xl mx-auto p-4 bg-white rounded-2xl mt-4">Pending ${pBills.length}</div>`; break;
      default: body = renderDashboard();
    }
    const pinnedSidebarHTML = ui.sidebarPinned ? `<aside class="hidden lg:block w-64 shrink-0 bg-[#141414] text-white min-h-[calc(100vh-52px)] p-3.5 border-r border-gray-800 sticky top-[52px]"><div class="space-y-1.5">${renderNavButtonsList()}</div></aside>` : '';
    appEl.innerHTML = `${renderTopBarAndAlerts()}<div class="flex">${pinnedSidebarHTML}<main class="flex-1 min-w-0 pb-10">${body}</main></div>`;
  }
  render();
</script>
</body>
</html>
